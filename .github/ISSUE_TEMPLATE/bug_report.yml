name: Bug report
description: Report a reproducible Community Edition defect
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction and expected behavior
      description: Use synthetic data. Do not attach credentials, databases, provider stores or private source.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: App version, OS and architecture
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized error and verification results
