name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      commit: ${{ steps.checkout.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        id: checkout
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Verify release version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync, appendFileSync } from 'node:fs';
          const json = path => JSON.parse(readFileSync(path, 'utf8'));
          const version = json('package.json').version;
          assert.equal(process.env.RELEASE_TAG, `v${version}`, 'Tag must match the application version');
          assert.equal(json('package-lock.json').version, version, 'npm lockfile version mismatch');
          assert.equal(json('package-lock.json').packages[''].version, version, 'npm root version mismatch');
          assert.equal(json('src-tauri/tauri.conf.json').version, version, 'Tauri version mismatch');
          const cargo = readFileSync('src-tauri/Cargo.toml', 'utf8');
          assert.equal(cargo.match(/^version\s*=\s*"([^"]+)"/m)?.[1], version, 'Cargo version mismatch');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=v${version}\nprerelease=${version.split('+')[0].includes('-')}\n`);
          NODE

  build:
    needs: prepare
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            target: aarch64-apple-darwin
            bundles: dmg
            artifact: macos-arm64
            path: dmg/*.dmg
          - name: macOS Intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
            artifact: macos-x64
            path: dmg/*.dmg
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            artifact: windows-x64
            path: nsis/*.exe
          - name: Linux x64 Debian
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb
            artifact: linux-amd64
            path: deb/*.deb
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libwebkit2gtk-4.1-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: npm ci
      - run: go test ./...
      - run: npm test
      - name: Build application and installer
        env:
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && '-' || '' }}
        run: npm run desktop:build -- --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} -- --locked
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: commitdeck-${{ matrix.artifact }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.path }}
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          persist-credentials: false
      - name: Verify tag still points to the built commit
        env:
          BUILT_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$BUILT_COMMIT"
      - uses: actions/download-artifact@v4
        with:
          pattern: commitdeck-*
          path: release-assets
          merge-multiple: true
      - name: Publish all installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' > release-draft.txt; then
            if [[ "$(cat release-draft.txt)" != "true" ]]; then
              echo "Release $RELEASE_TAG is already published; refusing to replace its assets."
              exit 1
            fi
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "CommitDeck $RELEASE_TAG" --generate-notes \
              --prerelease="$PRERELEASE"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease="$PRERELEASE"
