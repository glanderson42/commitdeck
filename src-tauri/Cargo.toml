[package]
name = "commitdeck"
version = "0.1.0"
description = "A workspace for parallel AI-assisted development"
edition = "2021"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tokio = { version = "1", features = ["sync", "time"] }
